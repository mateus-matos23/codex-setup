model = "gpt-5.6-terra"

model_provider = "openai"

model_reasoning_effort = "medium"

plan_mode_reasoning_effort = "medium"

model_reasoning_summary = "none"

model_verbosity = "low"

personality = "pragmatic"

approval_policy = "on-request"

sandbox_mode = "workspace-write"

tool_output_token_limit = 4000

# Project trust is machine-specific. Keep it in an ignored local profile.

[skills]
max_context_tokens = 2000

[tui]
theme = "dracula"
status_line = ["model-with-reasoning", "git-branch", "context-used", "current-dir", "weekly-limit", "five-hour-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[features]
memories = true
multi_agent = true
shell_tool = true

[agents]
max_concurrent_threads_per_session = 1

[agents.explorer]
description = "Leitura e mapeamento de código somente leitura: busca de arquivos, rastreio de dependências, levantamento de contexto antes de uma implementação."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "read-only"

[agents.worker]
description = "Implementação de código e correção de bugs a partir de um requisito já definido, sem ambiguidade."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents.reviewer]
description = "Revisão de PR/diff focada em corretude, segurança e decisões de arquitetura antes de considerar a tarefa concluída."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
